{% load i18n static jazzmin admin_urls %}
<style type="text/css">

</style>
<div class="modal modal-choose_client fade" id="modal_choose_client" data-backdrop="static" data-keyboard="false" aria-hidden="true" style="display: none">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<form enctype="multipart/form-data" id="form_choose_client" action="" method="post" target="_blank">
				{% csrf_token %}
				<div class="modal-header">
					<h4 class="modal-title">{{_("CHOIX DU CLIENT")}}</h4>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
				</div>
				<div class="modal-body">
					<div class="alert  alert-dismissible fade show hidden" role="alert">
						<span class="message">{{_("TRAITEMENT EN COURS")}}</span>
					</div>
					<div class="col-md-12 offset-0">
						<div class="row">
							<div class="col-md-6">
								<div class="form-group">
									<label>{% trans 'N° Client' %} : </label>
									<input id="search_numero_client" class="form-control" type="text" name="nc" style="border-radius:3px;border:1px solid rgba(0, 0, 0, 0.3);text-transform:uppercase;" placeholder="N° Client">
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label>{% trans 'Nom ou Prénoms complet' %} : </label>
									<input id="search_nom_client" class="form-control" type="text" name="nomc" style="border-radius:3px;border:1px solid rgba(0, 0, 0, 0.3);text-transform:uppercase;" placeholder="{% trans 'Nom ou Prénoms complet' %}">
								</div>
							</div>
							<div class="col-md-12">
								<button type="button" id="btn_search_client_police" class="btn btn-sm btn-info" style="float:right"><i class="fa fa-search"></i> Rechercher</button>
							</div>
						</div>
					</div>
                    <div class="col-md-12" id="list_police_client">
                        <hr>
                        <table id="table_liste_police" style="width:100%;" class="table table-bordered table-striped dataTable dtr-inline">
                            <thead>
                                <tr>
                                    <th style="width:5%">##</th>
                                    <th>{{_("Numéro")}}</th>
                                    <th class="text-center">{{_("Produit")}}</th>
                                    <th class="text-center">{{_("Assureur")}}</th>
                                    <th class="text-center">{{_("Date début")}}</th>
                                    <th class="text-center">{{_("Date échéance")}}</th>
                                </tr>
                            </thead>
                            <tbody>

                            </tbody>
                        </table>
                    </div>
					<div class="col-md-12 offset-0 error_box_aliment_not_found text-center text-red" style="display:none;font-weight: bold;font-size: 30px;"></div>
				</div>
				<div class="modal-footer justify-content-between">
					<button type="button" class="btn btn-default" data-dismiss="modal">{{_('Fermer')}}</button>
					<span id="loading_gif" style="display:none;color:#BB4127;">{{_("Chargement en cours")}}... <img src="{% static 'admin_custom/ripple-loader.svg' %}" style="width:50px;"></span>
					<button type="button" id="btn_confirm_selected_prestataire" class="btn o-bg-primary">{{_('Continuer')}}</button>
				</div>
			</form>
			<div class="form_sinistre_overlay"><div style="margin:auto;padding:20px 0;color:white;text-align:center;">{{_("TRAITEMENT EN COURS")}} ...</div></div>
		</div>
	</div>
</div>

<script>
$(document).ready(function() {
    $('#list_police_client').hide();

    $('#btn_search_client_police').click(function() {
        var numeroClient = $('#search_numero_client').val().toUpperCase();
        var nomClient = $('#search_nom_client').val().toUpperCase();
        var $tableBody = $('#table_liste_police tbody');
        $tableBody.empty();
        $('#loading_gif').show();

        $.ajax({
            url: '{% url "recherche_client_police" %}',
            type: 'POST',
            data: {
                'nc': numeroClient,
                'nomc': nomClient,
                'csrfmiddlewaretoken': $('input[name=csrfmiddlewaretoken]').val()
            },
            dataType: 'json',
            success: function(data) {
                $('#loading_gif').hide();
                if (data.success) {
                    if (data.polices && data.polices.length > 0) {
                        // Inspecter les données reçues
                        console.log("Données reçues :", data.polices);

                        // Formatter les données pour DataTable
                        var formattedData = data.polices.map(function(police) {
                            return [
                                '<input type="radio" name="selected_police" value="' + police.id + '">',
                                police.numero,
                                police.produit,
                                police.assureur,
                                police.date_debut,
                                police.date_echeance
                            ];
                        });

                        $('#list_police_client').show();
                        $('.error_box_aliment_not_found').hide();

                        if (!$.fn.DataTable.isDataTable('#table_liste_police')) {
                            // Initialiser DataTable
                            $('#table_liste_police').DataTable({
                                "language": {
                                    "url": "../../static/admin_custom/js/French.json"
                                },
                                lengthMenu: [
                                    [10, 25, 50, 100, -1], [10, 25, 50, 100, "Tout"]
                                ],
                                paging: true,
                                searching: true,
                                lengthChange: true,
                                bSort: false,
                                data: formattedData, // Utiliser les données formatées
                                columns: [ // Définir les colonnes
                                    { title: "" },
                                    { title: "Numéro" },
                                    { title: "Produit" },
                                    { title: "Assureur" },
                                    { title: "Date début" },
                                    { title: "Date échéance" }
                                ]
                            });
                        } else {
                            // Recharger les données
                            $('#table_liste_police').DataTable().clear().rows.add(formattedData).draw();
                        }

                    } else {
                        $('#list_police_client').hide();
                        $('.error_box_aliment_not_found').text('Aucune police trouvée pour ce client.').show();
                    }
                } else {
                    $('#list_police_client').hide();
                    $('.error_box_aliment_not_found').text(data.message || 'Client non trouvé.').show();
                }
            },
            error: function() {
                $('#loading_gif').hide();
                $('#list_police_client').hide();
                $('.error_box_aliment_not_found').text('Erreur lors de la recherche.').show();
            }
        });
    });

    // ... (votre code existant) ...
});
</script>
