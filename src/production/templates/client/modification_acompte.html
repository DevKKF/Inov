<form id="form_acompte" method="post">
	<input type="hidden" id="acompte_id" name="acompte_id" value="{{ acompte.id }}"/>

      <div class="modal-body">
          <div class="alert  alert-dismissible fade show hidden" role="alert">
              <span class="message"> {{_("TRAITEMENT EN COURS")}}</span>
          </div>
          <div class="row">
            <div class="col-md-6">
                <div class="form-group row">
                    <label class="col-sm-5 col-form-label">{{_("Montant")}} <span class="required">*</span></label>
                    <div class="col-sm-7">
                    <input type="text" class="form-control money_field" name="montant" id="montant" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-5 col-form-label">{{_("Date de versement")}} <span class="required">*</span></label>
                    <div class="col-sm-7">
                    <input type="date" class="form-control" name="date_versement" id="date_versement" required/>
                    </div>
                </div>
            </div>
            <div class="vl"></div>
            <div class="col-md-5">
                <div class="form-group row">
                    <label class="col-sm-5 col-form-label">{{_("Période début")}} </label>
                    <div class="col-sm-7">
                        <input type="date" class="form-control" name="periode_debut" id="periode_debut">
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-5 col-form-label">{{_("Période fin")}}</label>
                    <div class="col-sm-7">
                        <input type="date" class="form-control" name="periode_fin" id="periode_fin">
                    </div>
                </div>
            </div>
          </div>
      </div>
</form>
